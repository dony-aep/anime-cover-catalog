<div class="search-wrapper">
    <label class="search-container" [class.has-text]="animeService.searchTerm()">
        <svg lucideSearch class="search-icon"></svg>
        <input
            #searchInput
            type="search"
            id="searchInput"
            aria-label="Search titles"
            [placeholder]="placeholderText()"
            [value]="animeService.searchTerm()"
            (input)="onSearch($event)">
        @if (animeService.searchTerm()) {
            <button
                class="clear-search"
                type="button"
                title="Clear search"
                aria-label="Clear search"
                (click)="clearSearch()">
                <svg lucideX></svg>
            </button>
        } @else {
            <kbd class="shortcut-hint" title="Press / to search">/</kbd>
        }
    </label>
</div>
