name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Smoke test de la API
        run: npm run api:smoke

      # Las portadas originales no están en el repo: viven en Cloudflare R2.
      # Falla si animes.json referencia alguna que no se haya subido.
      - name: Portadas del catálogo en R2
        run: node workers/r2-images/verify.mjs

      - name: Tests del frontend
        run: npx ng test --watch=false

      - name: Build de producción
        run: npm run build
