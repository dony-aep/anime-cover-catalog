@if (!isFavoritesPage()) {
    @if (!animeService.noResults()) {
        <div class="top-controls-header">
            <div class="sort-control" role="group" aria-label="Sort covers">
                <button
                    type="button"
                    class="sort-option"
                    [class.active]="sortBy() === 'date'"
                    [attr.aria-pressed]="sortBy() === 'date'"
                    [title]="sortBy() === 'date' ? 'Reverse date order' : 'Sort by release year'"
                    (click)="selectDateSort()">
                    @if (animeService.dateSort() === 'newest') { <svg lucideArrowDown class="sort-icon"></svg> } @else { <svg lucideArrowUp class="sort-icon"></svg> }
                    {{ dateSortLabel() }}
                </button>
                <button
                    type="button"
                    class="sort-option"
                    [class.active]="sortBy() === 'name'"
                    [attr.aria-pressed]="sortBy() === 'name'"
                    [title]="sortBy() === 'name' ? 'Reverse alphabetical order' : 'Sort by title'"
                    (click)="selectNameSort()">
                    {{ nameSortLabel() }}
                </button>
            </div>
            <p class="anime-count">
                <span class="count-number">{{ animeCountText() }}</span>
                {{ animeCount() === 1 ? 'cover' : 'covers' }}
            </p>
        </div>
    }
} @else {
    <div class="top-controls-header favorites-header">
        <p class="anime-count">
            <span class="count-number">{{ favoritesCount() }}</span>
            {{ favoritesCount() === 1 ? 'favorite' : 'favorites' }}
        </p>
        @if (favoritesCount() > 0) {
            <button class="clear-favorites-button" type="button" (click)="clearAllFavorites()" title="Clear all favorites">
                <svg lucideTrash></svg>
                <span class="button-text">Clear all</span>
            </button>
        }
    </div>
}
